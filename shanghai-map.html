<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Shanghai Trip — 추천 강도순 투어</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  --bg: #faf8f4;
  --panel: rgba(255, 255, 255, 0.88);
  --ink: #2c2c2c;
  --tierA: #d64545;
  --tierB: #c4993e;
  --tierAll: #2c2c2c;
  --hotel: #c4993e;
  --landmark: #3a4a7a;
  --food: #d64545;
  --restaurant: #d6553b;
  --gold: #c4993e;
  --font-body: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --font-serif: 'Nanum Myeongjo', 'Batang', Georgia, serif;
  --font-mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
  --radius: 14px;
  --glass-border: 1px solid rgba(255,255,255,0.18);
  --glass-shadow: 0 4px 24px rgba(0,0,0,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-body); color: var(--ink); }
#map { width: 100%; height: 100%; z-index: 0; }

.glass {
  background: var(--panel);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: var(--glass-border);
  box-shadow: var(--glass-shadow);
  border-radius: var(--radius);
}

/* Tier filter panel (top-left) */
.tier-panel {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 8px;
}
.tier-panel button {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border: none;
  border-radius: 10px;
  background: transparent;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .25s ease;
  color: var(--ink);
  white-space: nowrap;
}
.tier-panel button:hover { background: rgba(0,0,0,0.05); }
.tier-panel button.active { color: #fff; }
.tier-panel button[data-tier="A"].active { background: var(--tierA); }
.tier-panel button[data-tier="B"].active { background: var(--tierB); }
.tier-panel button[data-tier="all"].active { background: var(--tierAll); }
.tier-panel .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* Trip info badge (top-right) */
.trip-badge {
  position: fixed;
  top: 16px;
  right: 16px;
  z-index: 1000;
  padding: 10px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: all .4s ease;
  text-align: center;
}
.badge-title {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
}
.badge-date {
  font-family: var(--font-mono);
  font-size: 11px;
  opacity: 0.6;
  letter-spacing: 0.5px;
}
.badge-sub {
  font-size: 10px;
  opacity: 0.5;
  margin-top: 2px;
}

/* Side panel — Top 10 ranking */
.side-panel {
  position: fixed;
  top: 90px;
  right: 16px;
  z-index: 1000;
  padding: 14px 16px;
  width: 280px;
  max-height: calc(100vh - 200px);
  overflow-y: auto;
}
.side-panel h3 {
  font-family: var(--font-serif);
  font-size: 14px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(0,0,0,0.08);
}
.rank-list { list-style: none; }
.rank-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 4px;
  font-size: 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: background .15s ease;
}
.rank-list li:hover { background: rgba(0,0,0,0.04); }
.rank-list li.unmapped { cursor: default; opacity: 0.55; }
.rank-list li.unmapped:hover { background: transparent; }
.rank-num {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  opacity: 0.5;
  width: 18px;
  text-align: right;
  flex-shrink: 0;
}
.rank-name {
  flex: 1;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rank-cat {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(0,0,0,0.06);
  opacity: 0.6;
  flex-shrink: 0;
}
.rank-score {
  font-family: var(--font-mono);
  font-size: 10px;
  opacity: 0.5;
  flex-shrink: 0;
}

/* Stop info card (bottom) */
.stop-card {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  padding: 14px 22px;
  min-width: 300px;
  max-width: 440px;
  width: calc(100% - 32px);
  transition: all .35s cubic-bezier(.4,0,.2,1);
  opacity: 1;
}
.stop-card.hide { opacity: 0; transform: translateX(-50%) translateY(12px); pointer-events: none; }
.stop-card-inner { display: flex; align-items: flex-start; gap: 14px; }
.stop-card-icon {
  font-size: 28px;
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: rgba(0,0,0,0.04);
  flex-shrink: 0;
}
.stop-card-body { flex: 1; min-width: 0; }
.stop-card-name {
  font-family: var(--font-serif);
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 2px;
}
.stop-card-name-cn {
  font-size: 12px;
  opacity: 0.5;
  margin-bottom: 6px;
}
.stop-card-desc {
  font-size: 13px;
  opacity: 0.75;
  line-height: 1.4;
}
.stop-card-meta {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  font-size: 11px;
  font-family: var(--font-mono);
  opacity: 0.5;
  flex-wrap: wrap;
}
.stop-card-videos {
  margin-top: 8px;
  font-size: 11px;
  opacity: 0.65;
  line-height: 1.4;
}
.approx-tag {
  display: inline-block;
  background: rgba(214, 69, 69, 0.12);
  color: var(--food);
  font-size: 9px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 6px;
  letter-spacing: 0.5px;
  vertical-align: middle;
}

/* Control bar (bottom center) */
.control-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: opacity .4s ease;
  max-width: 460px;
  width: calc(100% - 32px);
}
.control-bar.idle { opacity: 0.3; }
.control-bar:hover, .control-bar.active { opacity: 1; }
.ctrl-btn {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 10px;
  background: transparent;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .2s ease;
  color: var(--ink);
  flex-shrink: 0;
}
.ctrl-btn:hover { background: rgba(0,0,0,0.06); transform: scale(1.08); }
.ctrl-btn:active { transform: scale(0.95); }
.ctrl-btn.play-btn { width: 42px; height: 42px; font-size: 20px; }

.progress-wrap {
  flex: 1;
  height: 6px;
  background: rgba(0,0,0,0.08);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  min-width: 60px;
}
.progress-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--tierA);
  transition: width .15s linear, background .4s ease;
  position: relative;
}
.progress-fill::after {
  content: '';
  position: absolute;
  right: -5px;
  top: -4px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid currentColor;
  box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  color: inherit;
}

/* Tier overlay (replaces day overlay) */
.tier-overlay {
  position: fixed;
  inset: 0;
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(28, 31, 46, 0);
  backdrop-filter: blur(0px);
  pointer-events: none;
  transition: background .5s ease, backdrop-filter .5s ease;
}
.tier-overlay.show {
  pointer-events: auto;
  background: rgba(28, 31, 46, 0.75);
  backdrop-filter: blur(8px);
}
.tier-overlay-content { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.tier-overlay-num {
  font-family: var(--font-serif);
  font-size: 4rem;
  font-weight: 700;
  opacity: 0;
  transform: scale(0.5);
  transition: all .4s cubic-bezier(.4,0,.2,1);
}
.tier-overlay.show .tier-overlay-num {
  opacity: 1;
  transform: scale(1);
  transition-delay: .15s;
}
.tier-overlay-label {
  font-family: var(--font-serif);
  font-size: 1.2rem;
  color: #fff;
  opacity: 0;
  transform: translateY(12px);
  transition: all .4s ease;
}
.tier-overlay.show .tier-overlay-label {
  opacity: 1;
  transform: translateY(0);
  transition-delay: .35s;
}
.tier-overlay-sub {
  font-family: var(--font-body);
  font-size: 0.85rem;
  color: rgba(255,255,255,0.6);
  opacity: 0;
  transition: opacity .4s ease;
}
.tier-overlay.show .tier-overlay-sub {
  opacity: 1;
  transition-delay: .55s;
}

/* Leaflet marker overrides */
.stop-marker {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  font-size: 18px;
  transition: all .3s ease;
  cursor: pointer;
}
.stop-marker.hotel {
  background: var(--gold);
  color: #fff;
  border: 2px solid #fff;
}
.stop-marker.active {
  transform: scale(1.35);
  box-shadow: 0 0 0 6px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.2);
  z-index: 900 !important;
}
.stop-marker.dimmed { opacity: 0.4; }

/* Disclaimer banner */
.disclaimer {
  position: fixed;
  bottom: 78px;
  right: 16px;
  z-index: 999;
  padding: 6px 10px;
  font-size: 10px;
  color: rgba(255,255,255,0.85);
  background: rgba(58, 74, 122, 0.85);
  border-radius: 8px;
  max-width: 280px;
  line-height: 1.3;
  font-family: var(--font-mono);
}

@media (max-width: 720px) {
  .side-panel { display: none; }
}
@media (max-width: 600px) {
  .tier-panel { top: 10px; left: 10px; padding: 6px; }
  .tier-panel button { padding: 6px 10px; font-size: 12px; }
  .trip-badge { top: 10px; right: 10px; padding: 8px 12px; }
  .badge-title { font-size: 13px; }
  .stop-card { bottom: 80px; padding: 12px 16px; min-width: 0; }
  .stop-card-icon { width: 40px; height: 40px; font-size: 22px; }
  .stop-card-name { font-size: 14px; }
  .control-bar { bottom: 14px; padding: 8px 12px; }
  .tier-overlay-num { font-size: 3rem; }
  .disclaimer { display: none; }
}
</style>
</head>
<body>

<div id="map"></div>

<!-- Tier filter panel -->
<div class="tier-panel glass" id="tierPanel">
  <button data-tier="all" class="active"><span class="dot" style="background:var(--ink)"></span>All</button>
  <button data-tier="A"><span class="dot" style="background:var(--tierA)"></span>Tier A (Top 5)</button>
  <button data-tier="B"><span class="dot" style="background:var(--tierB)"></span>Tier B (Top 10)</button>
</div>

<!-- Trip badge -->
<div class="trip-badge glass">
  <span class="badge-title">🇨🇳 SHANGHAI</span>
  <span class="badge-date">5.22 ~ 5.25 (3박 4일)</span>
  <span class="badge-sub">Atour Light · Bund Dashijie</span>
</div>

<!-- Side panel: Top 10 ranking -->
<div class="side-panel glass" id="sidePanel">
  <h3>📊 Top 10 추천 강도</h3>
  <ol class="rank-list" id="rankList"></ol>
</div>

<!-- Stop info card -->
<div class="stop-card glass hide" id="stopCard">
  <div class="stop-card-inner">
    <div class="stop-card-icon" id="cardIcon">📍</div>
    <div class="stop-card-body">
      <div class="stop-card-name" id="cardName">—</div>
      <div class="stop-card-name-cn" id="cardNameCn"></div>
      <div class="stop-card-desc" id="cardDesc">—</div>
      <div class="stop-card-meta">
        <span id="cardScore"></span>
        <span id="cardCount"></span>
      </div>
      <div class="stop-card-videos" id="cardVideos"></div>
    </div>
  </div>
</div>

<!-- Control bar (autoplay through Top tier) -->
<div class="control-bar glass" id="controlBar">
  <button class="ctrl-btn" id="prevBtn" aria-label="Previous">⏮</button>
  <button class="ctrl-btn play-btn" id="playBtn" aria-label="Play">▶</button>
  <button class="ctrl-btn" id="nextBtn" aria-label="Next">⏭</button>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <button class="speed-btn ctrl-btn" id="resetBtn" aria-label="Reset">↻</button>
</div>

<!-- Tier transition overlay -->
<div class="tier-overlay" id="tierOverlay">
  <div class="tier-overlay-content">
    <span class="tier-overlay-num" id="overlayNum">TIER A</span>
    <span class="tier-overlay-label" id="overlayLabel">Top 5 추천 강도</span>
    <span class="tier-overlay-sub" id="overlaySub">15편 영상 가중 합산</span>
  </div>
</div>

<!-- Disclaimer -->
<div class="disclaimer">
  ⚠ 추천 강도순 투어 (시간순 동선 아님). 좌표 일부 추정 (±150m, GCJ-02 offset).
</div>

  { rank:7,  canonical:"택시",           category:"교통",  score:3639,  count:33,  stopId:null },
  { rank:8,  canonical:"상하이 디즈니랜드",category:"명소",  score:3616,  count:31,  stopId:null },
  { rank:9,  canonical:"마라탕",         category:"음식",  score:1868,  count:12,  stopId:null },
  { rank:10, canonical:"상하이 타워",     category:"명소",  score:1689,  count:13,  stopId:4 }
];

// SEGMENTS — recommended walking tour through TOP 5 mapped landmarks
// 호텔 → 와이탄 → 위위안 → 동방명주 → 상하이타워 (Tier A)
// 와이탄 → 위위안 is the most common transition across all 15 videos (4회)
const SEGMENTS = [
  { fromStop:0, toStop:2, tier:"A", note:"호텔에서 와이탄 도보 ~12분" },
  { fromStop:2, toStop:1, tier:"A", note:"와이탄→위위안 (15편 중 4편의 핵심 동선)" },
  { fromStop:1, toStop:3, tier:"A", note:"위위안→동방명주 (지하철 환승 한 정거장)" },
  { fromStop:3, toStop:4, tier:"A", note:"동방명주→상하이타워 도보" },
  { fromStop:4, toStop:5, tier:"B", note:"상하이타워→진마오 인접" }
];

const TIER_INFO = {
  A: { label:"Tier A · Top 5 추천 강도", sub:"15편 영상 가중 합산 상위 5",   color:"#d64545" },
  B: { label:"Tier B · Top 6–10",        sub:"가중 합산 6위 ~ 10위",         color:"#c4993e" }
};

const CATEGORY_COLORS = {
  hotel: "#c4993e",
  landmark: "#3a4a7a",
  restaurant: "#d6553b",
  food: "#d64545"
};

// ══════════════════════════════════════════
//  MAP INIT
// ══════════════════════════════════════════

const map = L.map('map', {
  center: [31.2350, 121.4870],
  zoom: 13,
  zoomControl: false
});
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap',
  maxZoom: 19
}).addTo(map);

// ══════════════════════════════════════════
//  MARKERS
// ══════════════════════════════════════════

const markers = {};
STOPS.forEach(stop => {
  const isHotel = stop.category === "hotel";
  const html = `<div class="stop-marker ${isHotel ? 'hotel' : ''}" data-id="${stop.id}">${stop.icon}</div>`;
  const icon = L.divIcon({
    className: 'stop-marker-wrap',
    html,
    iconSize: [36, 36],
    iconAnchor: [18, 18]
  });
  const marker = L.marker([stop.lat, stop.lng], { icon }).addTo(map);
  marker.on('click', () => focusStop(stop.id));
  markers[stop.id] = marker;
});

// ══════════════════════════════════════════
//  POLYLINES
// ══════════════════════════════════════════

const polylines = SEGMENTS.map(seg => {
  const from = STOPS.find(s => s.id === seg.fromStop);
  const to = STOPS.find(s => s.id === seg.toStop);
  const color = TIER_INFO[seg.tier].color;
  return L.polyline([[from.lat, from.lng], [to.lat, to.lng]], {
    color, weight: 4, opacity: 0.55, dashArray: '8,6'
  }).addTo(map);
});

// ══════════════════════════════════════════
//  STOP CARD
// ══════════════════════════════════════════

const cardEl = document.getElementById('stopCard');
let currentStopId = null;

function focusStop(stopId) {
  const stop = STOPS.find(s => s.id === stopId);
  if (!stop) return;
  currentStopId = stopId;

  cardEl.classList.add('hide');
  setTimeout(() => {
    document.getElementById('cardIcon').textContent = stop.icon;
    const nameNode = document.getElementById('cardName');
    nameNode.textContent = stop.nameKr;
    if (stop.approx) {
      const tag = document.createElement('span');
      tag.className = 'approx-tag';
      tag.textContent = 'APPROX';
      nameNode.appendChild(tag);
    }
    document.getElementById('cardNameCn').textContent = stop.nameCn || "";
    // desc set below with image

    const scoreEl = document.getElementById('cardScore');
    const countEl = document.getElementById('cardCount');
    if (stop.weighted_score != null) {
      scoreEl.textContent = `⚖ score ${stop.weighted_score.toLocaleString()}`;
      countEl.textContent = `📊 ${stop.raw_count} mentions`;
    } else {
      scoreEl.textContent = "🏨 숙박지";
      countEl.textContent = "";
    }

    // Image (if available via slug)
    let imgHtml = "";
    if (stop.slug && IMAGES[stop.slug]) {
      imgHtml = `<img src="${IMAGES[stop.slug]}" alt="${stop.nameKr}" style="width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin:8px 0 4px 0;">`;
    }
    const descEl = document.getElementById('cardDesc');
    descEl.innerHTML = imgHtml + '<div>' + stop.desc.replace(/"/g,'&quot;') + '</div>';

    const vidEl = document.getElementById('cardVideos');
    if (stop.videos && stop.videos.length) {
      const uniq = [];
      const seen = new Set();
      for (const v of stop.videos) {
        const k = `#${v.num}`;
        if (!seen.has(k)) { seen.add(k); uniq.push(v); }
      }
      vidEl.innerHTML = "🎬 " + uniq.map(v => `#${v.num} ${v.channel}`).join(" · ");
    } else {
      vidEl.innerHTML = "";
    }

    cardEl.classList.remove('hide');
  }, 180);

  // Fly to
  map.flyTo([stop.lat, stop.lng], Math.max(map.getZoom(), 14), { duration: 0.7 });

  // Active state
  document.querySelectorAll('.stop-marker').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.id) === stopId);
  });
}

// ══════════════════════════════════════════
//  TIER FILTER
// ══════════════════════════════════════════

document.getElementById('tierPanel').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('.tier-panel button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const tier = btn.dataset.tier;

  // Hotel always shown; landmarks filtered by tier
  STOPS.forEach(stop => {
    const marker = markers[stop.id];
    const show = (stop.category === "hotel") || (tier === "all") || (stop.tier === tier);
    if (show) { marker.addTo(map); } else { map.removeLayer(marker); }
  });

  // Polylines: only show if both endpoints visible
  polylines.forEach((pl, i) => {
    const seg = SEGMENTS[i];
    const fromVisible = (STOPS.find(s=>s.id===seg.fromStop).category==="hotel") ||
                        (tier === "all") || (STOPS.find(s=>s.id===seg.fromStop).tier === tier);
    const toVisible = (STOPS.find(s=>s.id===seg.toStop).category==="hotel") ||
                      (tier === "all") || (STOPS.find(s=>s.id===seg.toStop).tier === tier);
    if (fromVisible && toVisible) { pl.addTo(map); } else { map.removeLayer(pl); }
  });

  // Optional tier overlay flash
  if (tier !== "all" && TIER_INFO[tier]) {
    showTierOverlay(tier);
  }
});

function showTierOverlay(tier) {
  const info = TIER_INFO[tier];
  const overlay = document.getElementById('tierOverlay');
  document.getElementById('overlayNum').textContent = `TIER ${tier}`;
  document.getElementById('overlayNum').style.color = info.color;
  document.getElementById('overlayLabel').textContent = info.label;
  document.getElementById('overlaySub').textContent = info.sub;
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 1800);
}

// ══════════════════════════════════════════
//  SIDE PANEL
// ══════════════════════════════════════════

const rankList = document.getElementById('rankList');
TOP10_RANKING.forEach(item => {
  const li = document.createElement('li');
  li.className = item.stopId == null ? "unmapped" : "";
  li.innerHTML = `
    <span class="rank-num">${item.rank}.</span>
    <span class="rank-name">${item.canonical}</span>
    <span class="rank-cat">${item.category}</span>
    <span class="rank-score">${(item.score/1000).toFixed(1)}k</span>
  `;
  if (item.stopId != null) {
    li.addEventListener('click', () => focusStop(item.stopId));
  } else {
    li.title = "지도 위치 없음 (음식/앱/교통은 마커 없음)";
  }
  rankList.appendChild(li);
});

// ══════════════════════════════════════════
//  AUTOPLAY (tier A walk)
// ══════════════════════════════════════════

const PLAY_ORDER = [0, 2, 1, 3, 4, 5];  // 호텔 → 와이탄 → 위위안 → 동방명주 → 상하이타워 → 진마오
let playIdx = -1;
let isPlaying = false;

const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const progressFill = document.getElementById('progressFill');

function updateProgress() {
  const pct = playIdx < 0 ? 0 : ((playIdx + 1) / PLAY_ORDER.length) * 100;
  progressFill.style.width = pct + '%';
  const tier = playIdx >= 0 && STOPS.find(s=>s.id===PLAY_ORDER[playIdx]).tier === "A" ? "A" : "B";
  progressFill.style.background = playIdx < 0 ? "var(--tierA)" : TIER_INFO[tier] ? TIER_INFO[tier].color : "var(--tierA)";
}

function gotoIdx(idx) {
  if (idx < 0 || idx >= PLAY_ORDER.length) return;
  playIdx = idx;
  focusStop(PLAY_ORDER[idx]);
  updateProgress();
}

playBtn.addEventListener('click', () => {
  if (isPlaying) {
    isPlaying = false;
    playBtn.textContent = '▶';
  } else {
    isPlaying = true;
    playBtn.textContent = '⏸';
    if (playIdx < 0) gotoIdx(0);
    autoplayTick();
  }
});

function autoplayTick() {
  if (!isPlaying) return;
  setTimeout(() => {
    if (!isPlaying) return;
    if (playIdx < PLAY_ORDER.length - 1) {
      gotoIdx(playIdx + 1);
      autoplayTick();
    } else {
      isPlaying = false;
      playBtn.textContent = '▶';
    }
  }, 2800);
}

prevBtn.addEventListener('click', () => {
  if (playIdx > 0) gotoIdx(playIdx - 1);
});
nextBtn.addEventListener('click', () => {
  if (playIdx < PLAY_ORDER.length - 1) gotoIdx(playIdx + 1);
  else if (playIdx < 0) gotoIdx(0);
});
resetBtn.addEventListener('click', () => {
  playIdx = -1;
  isPlaying = false;
  playBtn.textContent = '▶';
  progressFill.style.width = '0%';
  map.flyTo([31.2350, 121.4870], 13, { duration: 0.6 });
  cardEl.classList.add('hide');
  document.querySelectorAll('.stop-marker').forEach(el => el.classList.remove('active'));
});

// ══════════════════════════════════════════
//  INITIAL FOCUS
// ══════════════════════════════════════════

setTimeout(() => focusStop(0), 600);  // 호텔부터

})();
</script>
